name: IndexNow
on:
  push:
    branches: [gh-pages]
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      KEY: cb48ff159a951fc036db20a5d5d446f6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Tell IndexNow which pages changed
        run: |
          host=$(cat CNAME)
          git diff --name-only HEAD~1 HEAD -- '*.html' | grep -v '^404' \
            | sed -e 's/index\.html$//' -e 's/\.html$//' -e "s|^|https://$host/|" > urls.txt || true
          # First run (or workflow changed): send every page in the sitemap.
          if git diff --name-only HEAD~1 HEAD | grep -q indexnow.yml; then
            grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' > urls.txt
          fi
          [ -s urls.txt ] || { echo "No changed pages"; exit 0; }
          sleep 90  # let GitHub Pages publish the key file first
          cat urls.txt
          jq -n --arg host "$host" --arg key "$KEY" --rawfile u urls.txt \
            '{host:$host, key:$key, keyLocation:("https://"+$host+"/"+$key+".txt"), urlList:($u|split("\n")|map(select(length>0)))}' > body.json
          curl -s -w "\nHTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json
